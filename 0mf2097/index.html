<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Must Fall 2097 — gioca nel browser</title>
<meta name="description" content="One Must Fall 2097 (freeware, Epic MegaGames 1994) eseguito nel browser con js-dos / DOSBox-X.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="js-dos/js-dos.css">
<script src="js-dos/js-dos.js"></script>
<style>
  :root { --accent: hsl(18 100% 55%); --accent2: hsl(200 100% 60%); }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: #eee; font-family: Inter, system-ui, sans-serif; }
  #jsdos { width: 100vw; height: 100vh; }
  #intro {
    position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; text-align: center;
    background: radial-gradient(ellipse at 50% 30%, hsl(18 80% 18%) 0%, #05060a 60%), #000;
    transition: opacity .5s ease;
  }
  #intro.hide { opacity: 0; pointer-events: none; }
  #intro::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, transparent 1px 3px);
  }
  h1 {
    font-family: Orbitron, sans-serif; font-weight: 900; margin: 0; line-height: 1;
    font-size: clamp(2.2rem, 7vw, 5.5rem); letter-spacing: .04em;
    background: linear-gradient(180deg, #fff 0%, var(--accent) 70%, hsl(0 90% 40%) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 24px hsl(18 100% 50% / .45));
  }
  .year { font-family: Orbitron, sans-serif; font-size: clamp(1.2rem, 3vw, 2rem); color: var(--accent2); letter-spacing: .5em; margin-top: .4em; }
  #play {
    margin-top: 2.2rem; padding: 1rem 3rem; font: 600 1.1rem Orbitron, sans-serif; letter-spacing: .15em;
    color: #fff; background: linear-gradient(135deg, var(--accent), hsl(350 90% 50%));
    border: 0; border-radius: 999px; cursor: pointer;
    box-shadow: 0 0 0 0 hsl(18 100% 55% / .6); animation: pulse 2s infinite;
    transition: transform .15s ease;
  }
  #play:hover { transform: scale(1.06); }
  @keyframes pulse { 70% { box-shadow: 0 0 0 22px hsl(18 100% 55% / 0); } 100% { box-shadow: 0 0 0 0 hsl(18 100% 55% / 0); } }
  .note { margin-top: 1.6rem; font-size: .85rem; opacity: .6; max-width: 32rem; padding: 0 1rem; }
  kbd { background: #222; border: 1px solid #444; border-radius: 4px; padding: 0 .35em; font-size: .8em; }
</style>
</head>
<body>
<main>
  <section id="intro">
    <div>
      <h1>ONE MUST FALL</h1>
      <div class="year">2097</div>
      <button id="play" type="button">▶ GIOCA</button>
      <p class="note">
        Freeware di Epic MegaGames (1994), eseguito in DOSBox-X via js-dos.<br>
        Primo caricamento ≈ 15 MB. Controlli P1: frecce + <kbd>Invio</kbd>/<kbd>Shift dx</kbd>.
      </p>
    </div>
  </section>
  <div id="jsdos"></div>
</main>
<script>
  const intro = document.getElementById("intro");
  document.getElementById("play").addEventListener("click", () => {
    intro.classList.add("hide");
    Dos(document.getElementById("jsdos"), {
      url: "omf2097.jsdos",
      pathPrefix: "js-dos/emulators/",
      backend: "dosboxX",
      autoStart: true,
      kiosk: true,
      renderAspect: "Fit",
    });
  }, { once: true });
</script>
</body>
</html>
